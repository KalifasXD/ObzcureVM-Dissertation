# License server over TLS (self-signed cert, PoC). The keystore is bundled on the classpath for the
# PoC; in production it would be externalized. The seed exchange is now encrypted in transit.
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:server-keystore.p12
# Keystore password: externalized. Defaults to the self-signed PoC value "changeit"; override in
# production via the OBZCURE_KEYSTORE_PASSWORD environment variable. The .p12 itself is gitignored.
server.ssl.key-store-password=${OBZCURE_KEYSTORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=licenseserver

# F5: shared secret the vendor build must present on POST /register (?token=...) so an unauthenticated
# attacker cannot (re)register a license and reset its node-lock binding. The value below is a PoC
# PLACEHOLDER: set the OBZCURE_REGISTER_SECRET environment variable to override it, and change it in
# production. The demo drivers read the same environment variable with the same placeholder default.
obzcure.register.secret=${OBZCURE_REGISTER_SECRET:obzcure-vendor-secret-change-me}
